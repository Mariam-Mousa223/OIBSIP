<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Authentication</title>
    <link rel="stylesheet" href="LoginAS.css">
</head>
<body>

    <div class="auth-card">
        <!-- أزرار التنقل بين التسجيل والدخول -->
        <div class="tabs">
            <button id="tabRegister" class="tab-btn active">Register</button>
            <button id="tabLogin" class="tab-btn">Login</button>
        </div>

        <!-- رسائل الخطأ والنجاح العامة -->
        <div id="alertBox" class="alert"></div>

        <!-- نموذج إنشاء حساب (Register) -->
        <form id="registerForm" class="auth-form active">
            <h2>Create New Account</h2>
            
            <div class="form-group">
                <label for="regUsername">Username:</label>
                <input type="text" id="regUsername" placeholder="Enter Username...">
            </div>

            <div class="form-group">
                <label for="regEmail">Email Address:</label>
                <input type="email" id="regEmail" placeholder="example@mail.com">
            </div>

            <div class="form-group">
                <label for="regPassword">Password:</label>
                <input type="password" id="regPassword" placeholder="8 Letters and at Least one number...">
            </div>

            <button type="submit" class="btn-submit">Register</button>
        </form>

        <!-- نموذج تسجيل الدخول (Login) -->
        <form id="loginForm" class="auth-form">
            <h2>Sign In</h2>

            <div class="form-group">
                <label for="loginIdentifier">Username or Email:</label>
                <input type="text" id="loginIdentifier" placeholder="Enter Username or Email...">
            </div>

            <div class="form-group">
                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" placeholder="Enter Password...">
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <!-- الصفحة المحمية (لوحة التحكم) -->
        <div id="dashboard" class="dashboard-view">
            <h2>Welcome to Your Dashboard! 👋</h2>
            <p>You have successfully logged in.</p>
            <div class="user-info">
                <strong>Current User:</strong> <span id="dashUser">--</span>
            </div>
            <button id="btnLogout" class="btn-logout">Logout</button>
        </div>
    </div>

    <script src="LoginAS.js"></script>
</body>
</html>
