<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تسجيل الدخول والمصادقة</title>
    <link rel="stylesheet" href="LoginAS.css">
</head>
<body>

    <div class="auth-card">
        <!-- أزرار التنقل بين التسجيل والدخول -->
        <div class="tabs">
            <button id="tabRegister" class="tab-btn active">إنشاء حساب</button>
            <button id="tabLogin" class="tab-btn">تسجيل الدخول</button>
        </div>

        <!-- رسائل الخطأ والنجاح العامة -->
        <div id="alertBox" class="alert"></div>

        <!-- نموذج إنشاء حساب (Register) -->
        <form id="registerForm" class="auth-form active">
            <h2>إنشاء حساب جديد</h2>
            
            <div class="form-group">
                <label for="regUsername">اسم المستخدم:</label>
                <input type="text" id="regUsername" placeholder="أدخل اسم المستخدم...">
            </div>

            <div class="form-group">
                <label for="regEmail">البريد الإلكتروني:</label>
                <input type="email" id="regEmail" placeholder="example@mail.com">
            </div>

            <div class="form-group">
                <label for="regPassword">كلمة المرور:</label>
                <input type="password" id="regPassword" placeholder="8 أحرف ورقم واحد على الأقل...">
            </div>

            <button type="submit" class="btn-submit">تسجيل</button>
        </form>

        <!-- نموذج تسجيل الدخول (Login) -->
        <form id="loginForm" class="auth-form">
            <h2>تسجيل الدخول</h2>

            <div class="form-group">
                <label for="loginIdentifier">اسم المستخدم أو البريد الإلكتروني:</label>
                <input type="text" id="loginIdentifier" placeholder="أدخل اسم المستخدم أو البريد...">
            </div>

            <div class="form-group">
                <label for="loginPassword">كلمة المرور:</label>
                <input type="password" id="loginPassword" placeholder="أدخل كلمة المرور...">
            </div>

            <button type="submit" class="btn-submit">تسجيل الدخول</button>
        </form>

        <!-- الصفحة المحمية (لوحة التحكم) -->
        <div id="dashboard" class="dashboard-view">
            <h2>مرحباً بك في لوحة التحكم المحمية! 👋</h2>
            <p>لقد قمت بتسجيل الدخول بنجاح إلى الصفحة المحمية.</p>
            <div class="user-info">
                <strong>المستخدم الحالي:</strong> <span id="dashUser">--</span>
            </div>
            <button id="btnLogout" class="btn-logout">تسجيل الخروج</button>
        </div>
    </div>

    <script src="LoginAS.js"></script>
</body>
</html>
