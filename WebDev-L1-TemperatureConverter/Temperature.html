<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقع تحويل درجة الحرارة</title>
    <link rel="stylesheet" href="Temperature.css">
</head>
<body>

    <div class="converter-card">
        <h1>مُحوِّل درجات الحرارة</h1>
        <!-- الجملة الإرشادية الجديدة -->
        <p class="subtitle">أدخل درجة الحرارة واختر الوحدة للحصول على التحويل الفوري</p>

        <div class="form-group">
            <label for="tempInput">درجة الحرارة:</label>
            <input type="number" id="tempInput" step="any" placeholder="أدخل القيمة هنا...">
            <div id="errorText" class="error-message"></div>
        </div>

        <div class="form-group">
            <label for="unitSelect">وحدة الإدخال:</label>
            <select id="unitSelect">
                <option value="celsius">مئوية (°C)</option>
                <option value="fahrenheit">فهرنهايت (°F)</option>
                <option value="kelvin">كلفن (K)</option>
            </select>
        </div>

        <button id="convertBtn" class="btn-convert">تحويل الآن</button>

        <div class="results-section">
            <div class="result-item">
                <span>سيليزيوس:</span>
                <span id="celsiusResult" class="result-value">-- C°</span>
            </div>
            <div class="result-item">
                <span>فهرنهايت:</span>
                <span id="fahrenheitResult" class="result-value">-- F°</span>
            </div>
            <div class="result-item">
                <span>كلفن:</span>
                <span id="kelvinResult" class="result-value">-- K</span>
            </div>
        </div>
    </div>

    <script src="Temperature.js"></script>
</body>
</html>
